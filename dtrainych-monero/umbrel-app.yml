manifestVersion: 1.1
id: dtrainych-monero
storage:
  dataRoot: data
category: crypto
name: Monero Node
version: "1.1.2"
tagline: Run a monero node
description: >-
  Run your monero node and independently store and validate every single Monero transaction with it.
  This is a full node that will download the entire Monero blockchain and store it on your Umbrel.
  This is the most secure way to run a Monero node, but it will take a long time to sync and will require a lot of storage space.
developer: deverickapollo
website: https://www.getmonero.org/
dependencies: []
repo: https://github.com/voltagebushels82/umbrel-monero
support: https://github.com/voltagebushels82/umbrel-monero/issues
port: 9976
submitter: dtrainych
submission: https://github.com/dtrainych/dtrainych-app-store
gallery: []
path: ""
defaultPassword: ""
releaseNotes: >-
  Updates the Monero dashboard to v1.1.2 with a refreshed interface, improved mining and network settings,
  Tor-only routing, working I2P support, and fixes for legacy testnet and incoming-connection settings.
  Monero daemon remains on v0.18.5.4. Existing blockchain data, settings, RPC credentials, and Tor identities are retained.
  Legacy dashboard-generated daemon configuration is backed up as bitmonero.conf.pre-v1.1.2 and rebuilt from saved settings.


  Restricted wallet RPC is available on port 18090 with a separate password shown in the dashboard's Connect dialog.
  ZMQ RPC uses port 18082 and ZMQ publish uses port 18084 when enabled in Advanced Settings.
  Incoming Tor peers use port 18083. Enable Incoming Connections to accept Tor and I2P peers.


  Dashboard source: https://github.com/voltagebushels82/umbrel-monero/releases/tag/v1.1.2
