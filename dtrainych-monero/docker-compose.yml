version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dtrainych-monero_server_1
      APP_PORT: 9976

  server:
    image: ghcr.io/voltagebushels82/umbrel-monero:v1.1.3
    depends_on: [monerod, tor, i2pd_daemon]
    restart: on-failure
    expose:
      - "9976"
    ports:
      - "18090:18090"
    volumes:
      - ${APP_DATA_DIR}/data/app:/data # volume to persist advanced settings json
      - ${APP_MONERO_DATA_DIR}:/monero/.monero # volume to persist bitmonero.conf
      # The dashboard loader uses these fixed paths; retain the installed onion identities.
      - ${TOR_DATA_DIR}/app-${APP_ID}-p2p:/tor-data/app-monero-p2p:ro
      - ${TOR_DATA_DIR}/app-${APP_ID}-rpc:/tor-data/app-monero-rpc:ro
      - ${APP_DATA_DIR}/data/i2pd:/i2pd-data:ro
    environment:
      PORT: "9976"
      MONERO_HOST: "${APP_MONERO_NODE_IP}"
      MONERO_P2P_PORT: "${APP_MONERO_P2P_PORT}"
      MONERO_RPC_PORT: "${APP_MONERO_RPC_PORT}"
      MONERO_RESTRICTED_RPC_PORT: "${APP_MONERO_RESTRICTED_RPC_PORT}"
      MONERO_DEFAULT_NETWORK: "${MONERO_DEFAULT_NETWORK}"
      MONERO_RPC_USER: "${APP_MONERO_RPC_USER}"
      MONERO_RPC_PASSWORD: "${APP_MONERO_RPC_PASS}"
      MONERO_RPC_HIDDEN_SERVICE: "${APP_MONERO_RPC_HIDDEN_SERVICE}"
      MONERO_P2P_HIDDEN_SERVICE: "${APP_MONERO_P2P_HIDDEN_SERVICE}"
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
      TOR_PROXY_IP: "${APP_MONERO_TOR_PROXY_IP}"
      TOR_PROXY_PORT: "9050"
      TOR_HIDDEN_SERVICE_DIR: /tor-data
      I2P_DAEMON_IP: "${APP_MONERO_I2P_DAEMON_IP}"
      I2P_DAEMON_PORT: "4447"
      I2P_P2P_KEY_FILE: /i2pd-data/monero-p2p.dat
      MONERO_TOR: "true"
      MONERO_I2P: "true"
      MONERO_ONION_P2P_PORT: "${APP_MONERO_TOR_PORT}"
      MONERO_ZMQ_PORT: "${APP_MONERO_ZMQ_PORT}"
      MONERO_ZMQ_PUB_PORT: "${APP_MONERO_ZMQ_PUB_PORT}"
      MONERO_RESTRICTED_RPC_USER: monero
      MONERO_RESTRICTED_RPC_PASSWORD: "${APP_MONERO_RESTRICTED_RPC_PASS}"
      MONERO_RESTRICTED_GATEWAY_HOST: 0.0.0.0
    networks:
      default:
        ipv4_address: $APP_MONERO_IP

  monerod:
    user: "1000:1000"
    # "unless-stopped" ensures monerod restarts via UI-triggered daemon restarts, not just on failure
    restart: unless-stopped
    stop_grace_period: 15m
    # First boot waits for the dashboard to generate the shared configuration.
    entrypoint:
      - /bin/sh
      - -c
      - 'until [ -s /home/monero/.bitmonero/bitmonero.conf ]; do sleep 1; done; exec /entrypoint.sh --config-file=/home/monero/.bitmonero/bitmonero.conf "$$@"'
      - monerod
    command:
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=${APP_MONERO_RPC_PORT}
      - --rpc-login=${APP_MONERO_RPC_AUTH}
    image: ghcr.io/sethforprivacy/simple-monerod:v0.18.5.4@sha256:e3daef3c78669a1421f06ee43fbeaf263b67794528aba7a70db1007a13721b33
    ports:
      - "${APP_MONERO_P2P_PORT}:${APP_MONERO_P2P_PORT}"
      - "${APP_MONERO_RPC_PORT}:${APP_MONERO_RPC_PORT}"
      # ZMQ listeners are enabled only by the dashboard's Advanced Settings.
      - "${APP_MONERO_ZMQ_PORT}:${APP_MONERO_ZMQ_PORT}"
      - "${APP_MONERO_ZMQ_PUB_PORT}:${APP_MONERO_ZMQ_PUB_PORT}"
    volumes:
      - "${APP_MONERO_DATA_DIR}:/home/monero/.bitmonero"
    networks:
      default:
        ipv4_address: $APP_MONERO_NODE_IP

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    networks:
      default:
        ipv4_address: "${APP_MONERO_TOR_PROXY_IP}"

  i2pd_daemon:
    image: ghcr.io/purplei2p/i2pd:release-3.0.0.1@sha256:f3ff7f0e501cc6baf383a5ca2a04659e0c9c8f8e9781e86aead2aa4decd27c9a
    user: "1000:1000"
    restart: on-failure
    command: ["--conf=/etc/i2pd/i2pd.conf", "--tunconf=/etc/i2pd/tunnels.conf"]
    volumes:
      - ${APP_DATA_DIR}/i2pd.conf:/etc/i2pd/i2pd.conf:ro
      - ${APP_DATA_DIR}/i2pd-tunnels.conf:/etc/i2pd/tunnels.conf:ro
      - ${APP_DATA_DIR}/data/i2pd:/home/i2pd/data
    networks:
      default:
        ipv4_address: "${APP_MONERO_I2P_DAEMON_IP}"
