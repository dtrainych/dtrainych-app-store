version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: dtrainych-opengym_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.2@sha256:57f4dd3fb9e4a6f48aa139b09de60398098ba85457f9498c1bcd4ac86c948f12
    restart: on-failure
    environment:
      PORT: 3000
      DATA_DIR: /data
      RP_ID: ${DEVICE_DOMAIN_NAME}
      ORIGIN: https://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      RP_NAME: openGym
      PASSWORD_LOGIN: "1"
      FIRST_USER_ADMIN: "1"
      TRUST_PROXY: "1"
    volumes:
      - ${APP_DATA_DIR}/data/api:/data

  web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.2@sha256:748c77417d40969d9840f064fd0cafecd84e47ac786d424688d0cff0d6b53299
    restart: on-failure
    depends_on:
      - api
    environment:
      BACKEND: api
      PORT: 3000

  # MCP HTTP sidecar; generated by mcp-http/render.py.
  mcp:
    image: node:22.23.4-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    init: true
    user: 0:0
    restart: on-failure
    depends_on:
    - api
    ports:
    - 3487:3487
    volumes_from:
    - api:ro
    environment:
      OPENGYM_DATA: /data
      OPENGYM_UID: ''
      MCP_TOKEN: ${APP_PASSWORD}
      MCP_ALLOWED_HOSTS: ${DEVICE_DOMAIN_NAME}:3487,${DEVICE_HOSTNAME}:3487,localhost:3487,127.0.0.1:3487
      MCP_ADAPTER_BASE64: 
    entrypoint:
    - node
    - --input-type=module
    - -e
    command:
    - await import('data:text/javascript;base64,')
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
